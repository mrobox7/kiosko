[project]
name = "dishpatch"
version = "0.1.0"
description = "Restaurant reception agent"
readme = "README.md"
authors = [{ name = "Your Name", email = "mrobox7@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "logfire[fastapi]>=0.50",
    "httpx>=0.27",
    "openai>=1.51",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "streamlit>=1.41",
    "sarvamai>=0.1.37",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
